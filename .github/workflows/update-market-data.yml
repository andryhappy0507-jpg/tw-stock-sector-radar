name: Update Taiwan market data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    # 07:10 UTC = 15:10 Taiwan time, Mon-Fri
    - cron: '10 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch market data
        run: python scripts/fetch_market_data.py
      - name: Build weekly metrics
        run: python scripts/build_weekly_radar.py
      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market_data.csv data/stock_master.csv data/weekly_signal.csv
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update Taiwan market data"
            git push
          fi
