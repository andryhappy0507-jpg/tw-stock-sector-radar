name: Update Taiwan market data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    # 07:10 UTC = 15:10 Taiwan time, Mon-Fri
    - cron: '10 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch market data
        run: python scripts/fetch_market_data.py
      - name: Build official classification master
        run: python scripts/build_classification_master.py
      - name: Build base theme coverage
        run: python scripts/build_base_theme_map.py
      - name: Validate market theme mappings
        run: python scripts/validate_theme_map.py
      - name: Build weekly metrics
        run: python scripts/build_weekly_radar.py
      - name: Build theme and related-group summaries
        run: python scripts/build_theme_signal_summary.py
      - name: Upload analysis test outputs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-analysis-test
          path: |
            data/weekly_signal.csv
            data/previous_week_signal.csv
            data/weekly_screen.csv
            data/weekly_summary.csv
            data/stock_master.csv
            data/stock_classification_master.csv
            data/base_theme_master.csv
            data/stock_base_theme_map.csv
            data/theme_master.csv
            data/stock_theme_map.csv
            data/theme_group_master.csv
            data/theme_group_map.csv
            data/theme_signal_summary.csv
            data/theme_group_signal_summary.csv
          retention-days: 1
          if-no-files-found: error
      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market_data.csv data/stock_master.csv data/stock_classification_master.csv data/base_theme_master.csv data/stock_base_theme_map.csv data/theme_master.csv data/stock_theme_map.csv data/theme_group_master.csv data/theme_group_map.csv data/theme_signal_summary.csv data/theme_group_signal_summary.csv data/weekly_signal.csv data/previous_week_signal.csv data/weekly_screen.csv data/weekly_summary.csv
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update Taiwan market data"
            git push
          fi
